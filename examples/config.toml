# drive-merge configuration. Copy to ~/.config/drive-merge/config.toml
# (or point DRIVEMERGE_CONFIG / --config at it). `drivemerge init` writes one for you.
#
# Clouds you connect with `drivemerge connect` (or from the page: `drivemerge ui`) are not listed here:
# they are kept in connections.toml and rclone.conf next to this file (both mode 600) and merged in
# when the config is loaded. Add [[remotes]] below only for clouds you manage with your own rclone remotes
# or for local folders; a name may not appear in both files.

[database]
path = "~/.local/share/drive-merge/catalog.db"

[rclone]
binary = "rclone"
# config = "~/.config/rclone/rclone.conf"   # default: rclone.conf next to this file (drive-merge's own)
extra_args = []

[rules]
# path = "~/.config/drive-merge/rules.toml"   # default: the packaged default_rules.toml

[safety]
execution_enabled = false        # master switch: nothing is ever written to a cloud while false
allow_probable_delete = false    # never delete on a name+size match without a hash proof
quarantine_dir = ".drive-merge-quarantine"
min_copies = 1

[api]
host = "127.0.0.1"
port = 8765
token = ""                       # generated by `drivemerge init`

# Examples (remove the leading "# "). `read` is used for scanning and hash bridging; create it with
# read-only OAuth scopes where the provider allows it (Drive: drive.readonly). `write` is only used by the
# executor; leave it out to keep a cloud read-only.
#
# [[remotes]]
# name = "gdrive"
# provider = "drive"
# read = "gdrive-ro:"
# write = "gdrive:"
# extra_args = ["--fast-list", "--drive-skip-shortcuts"]
#
# [[remotes]]
# name = "icloud"
# provider = "iclouddrive"
# read = "icloud:"
#
# `case_insensitive = true | false` overrides whether the remote treats `Docs` and `docs`
# as one name (default: Dropbox and OneDrive yes, Drive and iCloud no, a `local` disk
# yes on macOS and Windows and no on Linux). Set it for a mount that differs, e.g. exFAT.

# Alternative for iCloud on a Mac: scan the synced folder with the local backend.
# Turn off "Optimize Mac Storage" first, or you will scan placeholders.
# [[remotes]]
# name = "icloud-mac"
# provider = "local"
# read = "~/Library/Mobile Documents/com~apple~CloudDocs"
# hash_types = []                # local hashing reads every byte; bridge selectively instead
# case_insensitive = false       # only for a volume formatted case-sensitive (the APFS default is case-insensitive)
